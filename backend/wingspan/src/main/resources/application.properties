spring.datasource.url=jdbc:postgresql://localhost:5432/wingspan
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

spring.cloud.aws.credentials.access-key=${DO_ACCESS_KEY}
spring.cloud.aws.credentials.secret-key=${DO_SECRET_KEY}
spring.cloud.aws.s3.endpoint=https://sfo3.digitaloceanspaces.com
spring.cloud.aws.s3.path-style-access-enabled=true
spring.cloud.aws.region.static=us-east-1
spring.cloud.aws.ec2.metadata.enabled=false

digitalocean.bucket.name=wingspan
spring.cloud.aws.endpoint=https://sfo3.digitaloceanspaces.com

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

logging.file.name=/opt/wingspan/logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=50MB
logging.logback.rollingpolicy.max-history=5